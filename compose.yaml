name: transar

services:
  transar:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
    environment:
      VIRTUAL_HOST: trans.ar
      VIRTUAL_PORT: '80'
    ports:
      - '127.0.0.1:${TRANSAR_PORT:-8083}:80'
      # Compose combina las entradas cuando ambas usan 127.0.0.1.
      - '${TRANSAR_LAN_IP:-127.0.0.1}:${TRANSAR_PORT:-8083}:80'
    networks:
      - web
      - proxy
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s
    security_opt:
      - no-new-privileges:true

  php:
    build:
      context: .
      target: php
    restart: unless-stopped
    environment:
      TRANSAR_MAX_UPLOAD_BYTES: ${TRANSAR_MAX_UPLOAD_BYTES:-524288000}
      TRANSAR_MAX_DURATION_SECONDS: ${TRANSAR_MAX_DURATION_SECONDS:-7200}
    volumes:
      - jobs:/var/lib/transar/jobs
    networks:
      - web
    healthcheck:
      test: [CMD, php, -r, 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
      start_interval: 2s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    environment:
      TRANSAR_MODEL: ${TRANSAR_MODEL:-large-v3-turbo}
      TRANSAR_OLLAMA_URL: ${TRANSAR_OLLAMA_URL:-http://host.docker.internal:11434}
      TRANSAR_ARTICLE_MODEL: ${TRANSAR_ARTICLE_MODEL:-qwen3.5:4b}
      TRANSAR_MAX_UPLOAD_BYTES: ${TRANSAR_MAX_UPLOAD_BYTES:-524288000}
      TRANSAR_MAX_DURATION_SECONDS: ${TRANSAR_MAX_DURATION_SECONDS:-7200}
    volumes:
      - jobs:/var/lib/transar/jobs
      - models:/var/cache/transar
    networks:
      - download
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  jobs:
  models:

networks:
  web:
    internal: true
  download:
  proxy:
    external: true
