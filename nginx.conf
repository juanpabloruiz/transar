user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Docker vuelve a resolver el nombre cuando se recrea PHP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream php_fpm {
        zone php_fpm 64k;
        server php:9000 resolve;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name trans.ar;
        root /var/www/html;
        absolute_redirect off;
        client_max_body_size 502m;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

        location = / {
            rewrite ^ /index.php last;
        }

        location ~ ^/(index|api)\.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass php_fpm;
        }

        location ~ ^/(css|js|img)/[a-zA-Z0-9_./-]+\.(css|js|avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
            try_files $uri =404;
            expires 1h;
            access_log off;
        }

        location / {
            return 404;
        }
    }
}
